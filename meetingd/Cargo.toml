[package]
name = "meetingd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
audioadapter-buffers = "5.1"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
console = "0.16.6"
cpal = "0.18.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
dialoguer = "0.12.0"
dotenvy = "0.15.7"
hound = "3.5.1"
rubato = "5.1.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
